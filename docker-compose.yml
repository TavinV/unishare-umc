services:
  mysql:
    image: mysql:8.4
    container_name: unishare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root@UniShare2026
      TZ: America/Sao_Paulo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - unishare_mysql_data:/var/lib/mysql

volumes:
  unishare_mysql_data:
